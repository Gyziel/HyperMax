name: Build Pad 7 Pro system patch (OS3.0.307.0.WOYCNXM)

on:
  push:
    branches:
      - pad7pro-os3-307-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Patch muyu Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROM_VERSION: OS3.0.307.0.WOYCNXM
      ROM_URL: https://bigota.d.miui.com/OS3.0.307.0.WOYCNXM/muyu-ota_full-OS3.0.307.0.WOYCNXM-user-16.0-2154ce3df2.zip
    steps:
      - name: Free disk space for ROM extraction
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip unzip dos2unix
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone original patcher
        run: git clone --depth 1 https://github.com/sothx/xiaomi_pad_system_patch_additional_module.git source
      - name: Add strict device and ROM safety guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/module_src/customize.sh')
          original = p.read_text()
          guard = '''# Xiaomi Pad 7 Pro (muyu) exact firmware guard; do not force-install incompatible binaries.
          _gy_device="$(getprop ro.product.device)"
          _gy_rom="$(getprop ro.mi.os.version.incremental)"
          [ "$_gy_device" = "muyu" ] || abort "Unsupported device: $_gy_device (expected muyu)"
          [ "$_gy_rom" = "OS3.0.307.0.WOYCNXM" ] || abort "Firmware mismatch: $_gy_rom (expected OS3.0.307.0.WOYCNXM)"
          '''
          p.write_text(guard + '\n' + original)
          PY
      - name: Build system-specific module
        run: |
          cd source
          bash ./build.sh --rom "$ROM_VERSION" --url "$ROM_URL"
      - name: Check ZIP integrity and embedded system files
        run: |
          set -euo pipefail
          zipfile="source/dist/$ROM_VERSION.zip"
          test -s "$zipfile"
          unzip -t "$zipfile" | tail -n 2
          unzip -p "$zipfile" module.prop | grep -Fx "version=$ROM_VERSION"
          unzip -Z1 "$zipfile" | grep -Fx "system/system_ext/framework/miui-services.jar"
          unzip -Z1 "$zipfile" | grep -Fx "system/system_ext/priv-app/MiuiSystemUI/MiuiSystemUI.apk"
          sha256sum "$zipfile" | tee SHA256SUMS
      - name: Upload installable Magisk/KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Pad7Pro-OS3.0.307.0.WOYCNXM
          path: |
            source/dist/OS3.0.307.0.WOYCNXM.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
